name: "CI"
on:
  schedule:
    - cron: "0 15 * * 5"
  pull_request:
  push:
    branches:
      - master
      - refactor

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs_version: [30.1, 30.2, 31.1, snapshot]

    env:
      EMACS_MATRIX: ${{ matrix.emacs_version }}

    steps:
    # submodule (drone) はキャッシュから復元し、足りない分だけ ci-drones.sh sync で取得する
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # 認証情報を残さなければ、後処理で全 submodule の設定を掃除する手間 (macOS で十数秒) もかからない
        persist-credentials: false
    - uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}
    - name: Compute drone cache key
      id: key
      run: .github/scripts/ci-drones.sh key
    # ビルド済み drone を復元する。完全一致しなくても前回分を土台にし、
    # どこまで作り直すかは ci-drones.sh plan が判断する
    - name: Restore drones
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          lib
          .git/modules
          .git/ci-drones-state
        key: drones-${{ runner.os }}-${{ runner.arch }}-${{ matrix.emacs_version }}-${{ steps.key.outputs.toolchain }}-${{ steps.key.outputs.drones }}
        restore-keys: |
          drones-${{ runner.os }}-${{ runner.arch }}-${{ matrix.emacs_version }}-${{ steps.key.outputs.toolchain }}-
          drones-${{ runner.os }}-${{ runner.arch }}-${{ matrix.emacs_version }}-
    - name: Plan drone build
      id: plan
      run: .github/scripts/ci-drones.sh plan
      env:
        # 定期実行では全 drone をクリーンビルドし、差分ビルドで見逃しうる問題を検出する
        FORCE_FULL: ${{ github.event_name == 'schedule' }}
    - name: Sync drones
      run: .github/scripts/ci-drones.sh sync
    - name: Install Homebrew dependencies (on macOS)
      if: matrix.os == 'macos-latest' && steps.plan.outputs.mode != 'none'
      run: |
        env HOMEBREW_NO_AUTO_UPDATE=1 brew install texinfo libtool --formula
        echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
    - name: Install apt dependencies (on Ubuntu)
      if: matrix.os == 'ubuntu-latest' && steps.plan.outputs.mode != 'none'
      run: sudo apt install cmake libtool libtool-bin -y
    - name: Build drones
      run: .github/scripts/ci-drones.sh build ${{ steps.plan.outputs.mode }}
    - name: Save drones
      if: steps.plan.outputs.mode != 'none'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          lib
          .git/modules
          .git/ci-drones-state
        key: drones-${{ runner.os }}-${{ runner.arch }}-${{ matrix.emacs_version }}-${{ steps.key.outputs.toolchain }}-${{ steps.key.outputs.drones }}
    - run: make test
      env:
        ERROR_ON_WARN: t
        EL_GET_SKIP_BYTE_COMPILE: t
