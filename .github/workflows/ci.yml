name: "CI"
on:
  schedule:
    - cron: "0 15 * * 5"
  pull_request:
  push:
    branches:
      - master
      - refactor

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs_version: [30.1, 30.2, 31.1, snapshot]

    env:
      EMACS_MATRIX: ${{ matrix.emacs_version }}

    steps:
    # submodule (drone) はキャッシュから復元し、足りない分だけ ci-drones.sh sync で取得する
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # CI 中に push はしないので認証情報は残さない
        persist-credentials: false
    # drone のビルドに使う依存パッケージを setup-emacs と並行して入れておく。
    # 待つのは drone をビルドするときだけ (Wait for build dependencies)
    - name: Install build dependencies in background
      run: |
        if [ "$RUNNER_OS" = macOS ]; then
          cmd='env HOMEBREW_NO_AUTO_UPDATE=1 brew install texinfo libtool --formula'
        else
          cmd='sudo apt-get install -y cmake libtool libtool-bin'
        fi
        nohup bash -c "$cmd > '$RUNNER_TEMP/deps.log' 2>&1; echo \$? > '$RUNNER_TEMP/deps.status'" > /dev/null 2>&1 &
    - uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}
    - name: Compute drone cache key
      id: key
      run: .github/scripts/ci-drones.sh key
    # ビルド済み drone を復元する。キャッシュは同じキーで上書きできないため
    # 保存のたびに実行 ID 付きの新しいキーを使い、復元は前方一致で最新のものを拾う。
    # 完全一致しなくても前回分を土台にし、どこまで作り直すかは ci-drones.sh plan が判断する
    - name: Restore drones
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          lib
          .git/modules
          .git/ci-drones-state
        key: drones-${{ runner.os }}-${{ runner.arch }}-${{ matrix.emacs_version }}-${{ steps.key.outputs.toolchain }}-${{ steps.key.outputs.drones }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          drones-${{ runner.os }}-${{ runner.arch }}-${{ matrix.emacs_version }}-${{ steps.key.outputs.toolchain }}-${{ steps.key.outputs.drones }}-
          drones-${{ runner.os }}-${{ runner.arch }}-${{ matrix.emacs_version }}-${{ steps.key.outputs.toolchain }}-
          drones-${{ runner.os }}-${{ runner.arch }}-${{ matrix.emacs_version }}-
    - name: Plan drone build
      id: plan
      run: .github/scripts/ci-drones.sh plan
      env:
        # 定期実行では全 drone をクリーンビルドし、差分ビルドで見逃しうる問題を検出する
        FORCE_FULL: ${{ github.event_name == 'schedule' }}
    - name: Sync drones
      run: .github/scripts/ci-drones.sh sync
    - name: Wait for build dependencies
      if: steps.plan.outputs.mode != 'none'
      timeout-minutes: 10
      run: |
        while [ ! -f "$RUNNER_TEMP/deps.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/deps.log"
        [ "$(cat "$RUNNER_TEMP/deps.status")" = 0 ]
        if [ "$RUNNER_OS" = macOS ]; then
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
        fi
    - name: Build drones
      run: .github/scripts/ci-drones.sh build ${{ steps.plan.outputs.mode }} "${{ steps.plan.outputs.changed }}"
    - name: Save drones
      if: steps.plan.outputs.mode != 'none'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          lib
          .git/modules
          .git/ci-drones-state
        key: drones-${{ runner.os }}-${{ runner.arch }}-${{ matrix.emacs_version }}-${{ steps.key.outputs.toolchain }}-${{ steps.key.outputs.drones }}-${{ github.run_id }}-${{ github.run_attempt }}
    # tangle や辞書の取得は互いに独立しているので並列に走らせる
    - run: make -j"$(getconf _NPROCESSORS_ONLN)" test
      env:
        ERROR_ON_WARN: t
        EL_GET_SKIP_BYTE_COMPILE: t
